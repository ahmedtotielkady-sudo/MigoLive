const F=n=>Math.round(n).toLocaleString('en');
let bal=0,ready=false,chip=500,bets=A.map(()=>0),cur=0,busy=false,ac;

const hits=A.map((a,i)=>{const h=document.createElement('button');h.className='hit';h.style.left=a[3]+'%';h.style.top=a[4]+'%';h.onclick=()=>add(i);st.appendChild(h);
const b=document.createElement('div');b.className='bet';b.style.left=a[3]+'%';b.style.top=(a[4]-8.5)+'%';st.appendChild(b);return [h,b]});
[500,1000,10000,100000].forEach(v=>{const c=document.createElement('button');c.className='chip'+(v==500?' on':'');c.innerHTML='<u></u><s>'+v+'</s>';c.onclick=()=>{chip=v;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');tick(600)};document.getElementById('chips').appendChild(c)});
const total=()=>bets.reduce((a,b)=>a+b,0);
function ui(){document.getElementById('bal').textContent=F(bal);document.getElementById('tot').textContent=F(total());hits.forEach(([h,b],i)=>{b.style.display=bets[i]?'block':'none';b.textContent=F(bets[i])});try{if(ready)parent.postMessage({t:'set',v:bal},'*')}catch(e){}}
function snd(f,d,t='sine',g=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),k=ac.createGain();o.type=t;o.frequency.value=f;k.gain.value=g;k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(k);k.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function tick(f){snd(f,.08)}
function msg(t,ms=2500){ov.textContent=t;ov.classList.add('s');clearTimeout(msg.t);msg.t=setTimeout(()=>ov.classList.remove('s'),ms)}
function add(i){if(busy)return;hits.forEach(([h])=>h.classList.remove('win'));if(chip>bal){msg('الرصيد لا يكفي');return}bal-=chip;bets[i]+=chip;betRound=Math.floor(Date.now()/CYC);saveP();snd(900,.1,'triangle');ui()}

let H=[];
function renderH(){const hs=document.getElementById('hs'),bg=BG;hs.innerHTML='';for(let k=0;k<8;k++){const e=document.createElement('i'),a=A[H[k]];if(a){e.style.backgroundImage=bg;e.style.backgroundPosition=((6.25*a[3]-50)/5.25)+'% '+((6.25*a[4]-50)/5.25)+'%'}hs.appendChild(e)}}
const GAP=[22,65,108.7,155.5,205,251.7,294.5,337.7];
function showWin(i,p){let w=document.getElementById('wv');if(!w){w=document.createElement('div');w.id='wv';w.className='wv';w.innerHTML='<i id="wi"></i><b id="wn"></b><span id="wa"></span>';document.body.appendChild(w)}const a=A[i],e=document.getElementById('wi');e.style.backgroundImage=BG;e.style.backgroundPosition=((6.25*a[3]-50)/5.25)+'% '+((6.25*a[4]-50)/5.25)+'%';document.getElementById('wn').textContent=a[0]+' ×'+a[2];document.getElementById('wa').textContent=p>0?'ربحت '+F(p):(p<0?'آخر نتيجة':'حظ أوفر');e.style.animation='none';void e.offsetWidth;e.style.animation='';w.classList.add('s');clearTimeout(showWin.t);showWin.t=setTimeout(()=>w.classList.remove('s'),3000)}
const CYC=34000,BET=25000,SEND=30200;
function rng(n){let a=(n*2654435761)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function resultOf(n){const r=rng(n);const w=A.map(a=>1/a[2]),s=w.reduce((a,b)=>a+b);let x=r()*s,k=0;for(;k<7;k++){x-=w[k];if(x<=0)break}return{i:k,tg:A[k][1]+(r()*16-8)}}
let betRound=-1,doneN=-1,spunN=-1,rn=-1,siv;
function saveP(){try{localStorage.setItem('wheelP',JSON.stringify({n:betRound,b:bets}))}catch(e){}}
try{const q=JSON.parse(localStorage.getItem('wheelP')||'null');if(q&&q.b&&q.b.length==8){bets=q.b;betRound=q.n}}catch(e){}
function setH(fin){const L=[];for(let k=fin;k>fin-40&&L.length<8;k--){const r=resultOf(k);if(r.i>=0)L.push(r.i)}H=L;renderH()}
function startTicks(){clearInterval(siv);let last=-1;siv=setInterval(()=>{const m=new DOMMatrix(getComputedStyle(nd).transform),a=(Math.atan2(m.b,m.a)*180/Math.PI+360)%360,k=Math.floor(a/22.5);if(k!==last){last=k;snd(500+Math.random()*80,.05,'square',.06)}},30);setTimeout(()=>clearInterval(siv),5200)}
function applyRound(k,live){
 const r=resultOf(k),had=k===betRound&&total()>0;let p=0;
 if(had&&r.i>=0)p=bets[r.i]*A[r.i][2];
 if(had){bal+=p;bets=A.map(()=>0);betRound=-1;saveP();ui()}
 if(live){
  if(r.i<0){msg('وقف بين الحيوانات — جولة بدون فائز',3500)}
  else{hits[r.i][0].classList.add('win');showWin(r.i,p);
   if(p){snd(660,.3,'triangle');setTimeout(()=>snd(880,.4,'triangle'),150);setTimeout(()=>snd(1320,.5,'triangle'),300);msg('🎉 '+A[r.i][0]+' ×'+A[r.i][2]+' — ربحت '+F(p),4000)}
   else msg('وقف على '+A[r.i][0]+' ×'+A[r.i][2]+(had?' — حظ أوفر':''),3500)}
 }
 return{had,p}
}
function tick(){
 const now=Date.now(),n=Math.floor(now/CYC),t=now%CYC,fin=t>=SEND?n:n-1,c=document.getElementById('cd');
 if(n!==rn){rn=n;hits.forEach(([h])=>h.classList.remove('win'))}
 busy=t>=BET;
 if(t>=BET&&spunN<n){spunN=n;const r=resultOf(n),d=((r.tg-cur)%360+360)%360;
  if(t<BET+600){cur+=1800+d;nd.style.transform='rotate('+cur+'deg)';startTicks()}
  else{nd.style.transition='none';cur+=d;nd.style.transform='rotate('+cur+'deg)';void nd.offsetWidth;nd.style.transition=''}}
 if(doneN<fin){const live=fin===n&&t-SEND<1500;let away=0,any=false;
  for(let k=doneN+1;k<=fin;k++){const o=applyRound(k,live&&k===fin);if(o.had){any=true;away+=o.p}}
  doneN=fin;setH(fin);
  if(!live&&any)msg(away?'أثناء غيابك ربحت '+F(away):'أثناء غيابك: جولات بدون ربح',4000)}
 if(t<BET){const s=Math.ceil((BET-t)/1000);if(c.textContent!=s){c.textContent=s;c.classList.remove('sp');if(s<=5)snd(800,.1,'square',.08)}}
 else{c.textContent='🎯';c.classList.add('sp')}
}
(function(){const now=Date.now(),n=Math.floor(now/CYC),t=now%CYC,fin=t>=SEND?n:n-1;
 doneN=(betRound>=0&&total()>0)?Math.min(betRound-1,fin):fin;
 spunN=n-1;cur=resultOf(n-1).tg;nd.style.transition='none';nd.style.transform='rotate('+cur+'deg)';void nd.offsetWidth;nd.style.transition='';
 setH(fin);ui();tick();setInterval(tick,200)})();
addEventListener('message',e=>{const d=e.data;if(d&&d.t==='bal'){bal=d.v;ready=true;ui()}});try{parent.postMessage({t:'get'},'*')}catch(e){}
</script></body></html>
