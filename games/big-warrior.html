<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160b2d">
<title>المحارب الكبير - مايجو لايف</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 25%,#56308a 0,#24113f 45%,#10091f 100%);color:#fff}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.panel{width:min(100%,440px);padding:34px 22px;border:1px solid #b98cff66;border-radius:26px;background:#160d29dd;box-shadow:0 18px 60px #0008}
.icon{font-size:76px;filter:drop-shadow(0 8px 18px #d49cff66)}h1{font-size:27px;margin:14px 0 10px;color:#f2d28a}p{font-size:16px;line-height:1.9;color:#ddd0ef;margin:0}
.tag{display:inline-block;margin-top:22px;padding:10px 18px;border-radius:30px;background:#6b3c9b;color:#fff;font-weight:bold}
</style>
</head>
<body><main><section class="panel"><div class="icon">⚔️</div><h1>المحارب الكبير</h1><p>اللعبة مضافة إلى مايجو لايف، لكن ملف اللعبة الأصلي غير متوفر حالياً. أرسل ملفاتها الأصلية حتى نركّبها بنفس تصميمها ونربطها بمحفظة المستخدم.</p><span class="tag">قيد التجهيز</span></section></main></body>
</html>
