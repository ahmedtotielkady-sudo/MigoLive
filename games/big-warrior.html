<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170b24">
<title>المحارب الكبير</title>
<style>
:root{color-scheme:dark;--gold:#f5cc68;--purple:#35164d;--panel:#241034}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,Tahoma,sans-serif;background:radial-gradient(ellipse at top,#54246c,#170b24 65%);color:#fff}
body{min-height:100dvh;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 18px)}
main{width:min(100%,520px);display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:12px 10px}
h1{margin:0;color:var(--gold);font-size:clamp(25px,7vw,36px)}
.sub{color:#d6c4e5;margin-top:5px;font-size:13px}
.wallet{display:flex;justify-content:space-between;align-items:center;background:#12091e;border:1px solid #8c693a;border-radius:16px;padding:12px 15px}
.wallet strong{color:var(--gold);font-size:20px}
.panel{background:linear-gradient(145deg,#351b4a,#1d102b);border:1px solid #79549a;border-radius:20px;padding:16px;box-shadow:0 10px 28px #0005}
h2{font-size:16px;margin:0 0 12px;color:#f4d78d}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button{font:inherit;cursor:pointer;touch-action:manipulation;min-height:48px;border-radius:14px;border:1px solid #9674ad;background:#28143a;color:#fff;font-weight:800}
button:disabled{opacity:.5;cursor:wait}
.choice{padding:14px 5px;display:flex;flex-direction:column;align-items:center;gap:8px}
.choice .emoji{font-size:clamp(35px,10vw,54px)}
.choice.selected,.bet.selected{border:2px solid var(--gold);background:#523365;box-shadow:0 0 0 2px #f5cc6830}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bet{min-height:44px}
#play{width:100%;background:linear-gradient(135deg,#f5d47b,#b77a29);color:#28142d;border:0;font-size:18px;min-height:54px}
#status{min-height:26px;text-align:center;color:#f4d78d;font-weight:700;line-height:1.5}
.result{display:flex;justify-content:space-around;align-items:center;text-align:center}
.result b{display:block;font-size:23px;color:var(--gold);margin-top:4px}
.note{font-size:12px;color:#c5b2d5;text-align:center;line-height:1.7}
</style>
</head>
<body>
<main>
<header><h1>⚔️ المحارب الكبير</h1><div class="sub">الأسد 🦁 ضد النمر 🐯</div></header>
<section class="wallet"><span>رصيدك</span><strong id="coins">— 🪙</strong></section>
<section class="panel">
<h2>اختر المحارب</h2>
<div class="choices">
<button class="choice selected" data-pick="lion"><span class="emoji">🦁</span><span>الأسد</span></button>
<button class="choice" data-pick="tiger"><span class="emoji">🐯</span><span>النمر</span></button>
<button class="choice" data-pick="draw"><span class="emoji">🤝</span><span>تعادل</span></button>
</div>
</section>
<section class="panel">
<h2>حدد قيمة الرهان</h2>
<div class="bets">
<button class="bet selected" data-bet="100">100</button>
<button class="bet" data-bet="500">500</button>
<button class="bet" data-bet="1000">1,000</button>
<button class="bet" data-bet="2000">2,000</button>
<button class="bet" data-bet="5000">5,000</button>
<button class="bet" data-bet="10000">10,000</button>
</div>
</section>
<section class="panel result">
<div>آخر نتيجة<b id="winner">—</b></div>
<div>الجائزة<b id="payout">0</b></div>
</section>
<button id="play">ابدأ الجولة</button>
<div id="status" role="status" aria-live="polite">اختر المحارب والرهان ثم ابدأ</div>
<div class="note">يتم تأكيد الرهان والنتيجة من حسابك مباشرة. لا يتم تعديل الرصيد من داخل اللعبة.</div>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
let pick="lion",bet=100,coins=null,busy=false;
const labels={lion:"الأسد 🦁",tiger:"النمر 🐯",draw:"تعادل 🤝"};
function setStatus(s){$("status").textContent=s}
function updateCoins(v){const n=Number(v);if(!Number.isSafeInteger(n)||n<0)return false;coins=n;$("coins").textContent=n.toLocaleString("en-US")+" 🪙";return true}
document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{if(busy)return;pick=b.dataset.pick;document.querySelectorAll("[data-pick]").forEach(x=>x.classList.toggle("selected",x===b))}));
document.querySelectorAll("[data-bet]").forEach(b=>b.addEventListener("click",()=>{if(busy)return;bet=Number(b.dataset.bet);document.querySelectorAll("[data-bet]").forEach(x=>x.classList.toggle("selected",x===b))}));
function gameRequest(){
 return new Promise((resolve,reject)=>{
  const requestId=crypto.randomUUID().replace(/-/g,"");
  const timer=setTimeout(()=>{removeEventListener("message",handler);reject(new Error("تأخر تأكيد الجولة. أعد المحاولة"))},20000);
  function handler(e){if(e.source!==parent)return;const d=e.data;if(!d||d.t!=="migo:game-result"||d.requestId!==requestId)return;clearTimeout(timer);removeEventListener("message",handler);d.ok?resolve(d.data):reject(new Error(d.message||"تعذر تنفيذ الجولة"))}
  addEventListener("message",handler);
  parent.postMessage({t:"migo:game-request",requestId,path:"/games/big-warrior/fight",body:{bet,pick}},"*");
 });
}
async function play(){
 if(busy)return;
 if(coins===null){setStatus("جارٍ تحميل المحفظة");parent.postMessage({t:"get"},"*");return}
 if(coins<bet){setStatus("رصيدك لا يكفي لهذا الرهان");return}
 busy=true;$("play").disabled=true;$("play").textContent="جارٍ تأكيد الجولة...";
 $("winner").textContent="…";$("payout").textContent="…";setStatus("جاري تنفيذ الجولة");
 try{
  const data=await gameRequest();
  if(!updateCoins(data.coins))throw new Error("تعذر تأكيد الرصيد");
  $("winner").textContent=labels[data.winner]||"—";
  $("payout").textContent=(Number(data.payout)||0).toLocaleString("en-US");
  setStatus(data.won?"مبروك! كسبت الجولة 🎉":"انتهت الجولة، حظ أوفر");
  parent.postMessage({t:"refresh"},"*");
 }catch(e){setStatus(e.message||"تعذر تنفيذ الجولة")}
 finally{busy=false;$("play").disabled=false;$("play").textContent="ابدأ الجولة"}
}
$("play").addEventListener("click",play);
addEventListener("message",e=>{if(e.source!==parent)return;const d=e.data||{};if(d.t==="bal"){if(updateCoins(d.v))setStatus("اختر المحارب والرهان ثم ابدأ")}else if(d.t==="wallet-error"){coins=null;$("coins").textContent="— 🪙";setStatus(d.message||"تعذر تحميل المحفظة")}});
parent.postMessage({t:"get"},"*");
addEventListener("focus",()=>parent.postMessage({t:"get"},"*"));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)parent.postMessage({t:"get"},"*")});
})();
</script>
</body>
</html>
