<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بيتزا يم</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:radial-gradient(ellipse at 50% 42%,#6e13b5 0%,#4b0792 48%,#260052 100%);color:#fff;font-family:Tahoma,Arial,sans-serif}
.app{width:100%;max-width:none;min-height:100dvh;margin:auto;padding:12px 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:center;position:relative;min-height:52px;background:#5b08a0;border-radius:18px;padding:5px}.head h1{font-size:25px;color:#ffe56c;margin:0;text-shadow:0 2px 8px #250044}.help,.refresh{position:absolute;top:5px;width:46px;height:46px;border:0;border-radius:15px;background:#31066c;color:white;font-size:23px}.help{right:5px}.refresh{left:5px}
.stats{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:88px}.wallet{direction:rtl;text-align:right;background:#ffd51d;color:#402500;border-radius:0 0 30px 30px;padding:14px 20px;font-size:21px;font-weight:bold;min-width:48%;box-shadow:0 5px 0 #d99b12}.daily{direction:rtl;text-align:center;color:#ffe45c;font-size:16px;min-width:28%}.daily strong{display:block;font-size:30px}
.hint{text-align:center;color:#f0dcff;font-size:14px;margin:2px 0}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1/1.02;max-height:58vh;min-height:340px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;width:82%;height:78%;top:9%;left:9%;border:7px solid #25e9b0;border-radius:50%;box-shadow:0 0 12px #00ffd0,0 0 28px #e3ff1c,inset 0 0 16px #fff7;opacity:.9}
.ring:before{content:"";position:absolute;inset:10px;border:3px dashed #ffe52b;border-radius:50%;filter:drop-shadow(0 0 5px #ffe52b)}
.spokes{position:absolute;inset:17% 14%;background:repeating-conic-gradient(from -22.5deg,transparent 0deg 43deg,#00eaff 44deg 46deg,transparent 47deg 90deg);clip-path:circle(49%);opacity:.9}
.board{position:absolute;inset:0;z-index:2}
.food{position:absolute;width:23%;height:21%;max-width:104px;min-height:78px;border:4px solid #1de5b0;border-radius:25px;background:linear-gradient(145deg,#fff,#c8bce7 72%,#9a83cf);box-shadow:0 0 0 4px #183e69,0 0 17px #00ffd0;color:#29114e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:37px;padding:4px;transform:translate(-50%,-50%);cursor:pointer}
.food small{font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 4px #24104c}.food .stake{font-size:10px;color:#fff;background:#27105f;border-radius:8px;padding:3px 5px;white-space:nowrap;min-height:17px}
.food.selected{border-color:#ffe22a;box-shadow:0 0 0 3px #ffe22a,0 0 20px #ffe22a}.food.win{border-color:#ff4ebc;box-shadow:0 0 0 4px #ff4ebc,0 0 25px #ff4ebc}
.food:nth-child(1){left:50%;top:12%}.food:nth-child(2){left:78%;top:25%}.food:nth-child(3){left:87%;top:53%}.food:nth-child(4){left:72%;top:80%}.food:nth-child(5){left:50%;top:88%}.food:nth-child(6){left:28%;top:80%}.food:nth-child(7){left:13%;top:53%}.food:nth-child(8){left:22%;top:25%}
.mascot{position:absolute;z-index:4;left:50%;top:51%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border:4px solid #ffbd27;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#ffe66b 0 54%,#ffae28 56% 68%,#8c21d6 70%);font-size:57px;text-shadow:0 2px 4px #642078;filter:drop-shadow(0 0 14px #ffdf31)}
.mascot b{font-size:32px;color:#ffdc21;line-height:1}.mascot small{font-size:11px;color:#fff}
.decor{position:absolute;z-index:5;bottom:0;font-size:48px;filter:drop-shadow(0 3px 4px #200044)}.decor.salad{left:4%}.decor.pizza{right:4%}
.controls{background:#5f4bdc;border-radius:25px;padding:15px 10px;box-shadow:0 7px 0 #321078;text-align:center}.controls p{margin:0 0 13px;font-size:16px;color:#fff}
.chips{display:flex;gap:6px;justify-content:center;direction:ltr}.chip{flex:1;min-width:0;border:0;border-radius:18px;padding:14px 2px;background:#f5f3f7;color:#28202c;font-weight:bold;font-size:15px;box-shadow:0 4px 0 #c7b8dc}.chip.active{background:#ff8b27;color:white;box-shadow:0 4px 0 #b64c13}
.total{text-align:center;font-size:18px;font-weight:bold;color:#fff;margin:0}
.actions{display:flex;gap:8px}.spin,.clear{border:0;border-radius:20px;padding:15px 12px;font-weight:bold;font-size:17px}.spin{flex:1;background:linear-gradient(90deg,#ffbd22,#ffe77c);color:#402000}.clear{background:#5b2b82;color:#fff}.spin:disabled{opacity:.5}
.status{text-align:right;min-height:54px;padding:14px 16px;border-radius:20px;background:#4720a0;font-weight:bold;color:#ffe17a;font-size:17px}.footer{text-align:center;color:#d7c2f2;font-size:12px}
@keyframes glow{50%{filter:brightness(1.3) drop-shadow(0 0 12px #ffe52b)}}.board.spinning .food{animation:glow .45s ease-in-out infinite alternate}
@media(max-height:720px){.wheel-wrap{max-height:48vh;min-height:280px}.food{border-radius:17px;font-size:29px}.mascot{font-size:43px}}
</style></head><body><main class="app">
<div class="head"><button class="refresh" id="refresh" aria-label="إعادة ضبط العرض">↻</button><h1>🍕 بيتزا يم</h1><button class="help" aria-label="مساعدة">؟</button></div>
<div class="stats"><div class="wallet">العملات: <span id="coins">—</span> 🪙</div><div class="daily">حصيلة اليوم<strong id="daily">0</strong></div></div>
<div class="hint">اختيار مقدار الرهان ثم اختيار الطعام</div>
<section class="wheel-wrap"><div class="ring"></div><div class="spokes"></div><section class="board" id="board"></section><div class="mascot">😋<b id="countdown">7</b><small>سيقف بعد</small></div><div class="decor salad">🥗</div><div class="decor pizza">🍕</div></section>
<section class="controls"><p>اختيار مقدار الرهان &gt; اختيار الطعام</p><div class="chips" id="chips"></div></section>
<div class="total">إجمالي الرهان: <span id="total">0</span></div>
<div class="actions"><button class="clear" id="clear">مسح الرهانات</button><button class="spin" id="spin" disabled>تأكيد الرهانات</button></div>
<div class="status" id="status">جارٍ الاتصال بالمحفظة…</div></main>
<script>
(()=>{"use strict";
const foods=[["🥕",5],["🥑",5],["🥬",5],["🍅",5],["🌯",10],["🌭",15],["🍕",25],["🍗",45]];
const chips=[10000,1000,100,50,10];let bets=Array(8).fill(0),bet=10,busy=false,coins=0;
let statePending=false,betPending=false,betRequestId="",stateRequestId="",lastRound=0,roundOutcome=null;
const $=id=>document.getElementById(id),board=$("board");
function makeKey(){const a=new Uint8Array(24);crypto.getRandomValues(a);return "pizza-yam-"+[...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function send(action,payload,id){parent.postMessage({t:"migo:game:request",gameId:"pizza-yam",action,requestId:id,payload:payload||{}},"*")}
function renderBets(){const total=bets.reduce((a,b)=>a+b,0);[...board.children].forEach((el,i)=>{el.classList.toggle("selected",bets[i]>0);el.querySelector(".stake").textContent=bets[i]?("🪙 "+bets[i].toLocaleString("en-US")):"بدون رهان"});$("total").textContent=total.toLocaleString("en-US");$("spin").disabled=busy||total===0;[...$("chips").children].forEach(x=>x.disabled=busy)}
foods.forEach((f,i)=>{const el=document.createElement("button");el.className="food";el.innerHTML=f[0]+"<small>×"+f[1]+"</small><span class=\"stake\">بدون رهان</span>";el.onclick=()=>{if(busy)return;bets[i]+=bet;renderBets()};board.append(el)});
chips.forEach(v=>{const el=document.createElement("button");el.className="chip"+(v===bet?" active":"");el.textContent=v.toLocaleString("en-US");el.onclick=()=>{if(busy)return;bet=v;[...$("chips").children].forEach(x=>x.classList.toggle("active",x===el))};$("chips").append(el)});
function requestState(){if(statePending)return;statePending=true;stateRequestId=makeKey();send("state",{},stateRequestId)}
function finishRound(r){const outcome=r.outcome||{};const winning=outcome.winningIndices||[];[...board.children].forEach((el,i)=>el.classList.toggle("win",winning.includes(i)));const settlement=r.userSettlement||{};const payout=Number(settlement.payout||0);$("status").textContent=settlement.hasBets?(payout>0?"🎉 مبروك! ربحت "+payout.toLocaleString("en-US")+" عملة":"انتهت الجولة — حظ أوفر في المرة القادمة"):"انتهت الجولة";bets=Array(8).fill(0);busy=false;betPending=false;renderBets()}
$("clear").onclick=()=>{if(busy)return;bets=Array(8).fill(0);renderBets();$("status").textContent="تم مسح الرهانات"};
$("spin").onclick=()=>{if(busy||betPending||bets.every(x=>x===0))return;busy=true;betPending=true;betRequestId=makeKey();$("status").textContent="جاري تأكيد الرهانات…";renderBets();send("spin",{bets:bets.slice()},betRequestId)};
$("refresh").onclick=()=>{requestState();$("status").textContent="جارٍ تحديث اللعبة والمحفظة…"};
window.addEventListener("message",event=>{const d=event.data;if(!d||d.t!=="migo:game:response")return;
if(d.requestId===betRequestId){betPending=false;if(!d.ok){busy=false;if(Number.isSafeInteger(Number(d.coins)))coins=Number(d.coins);$("coins").textContent=coins.toLocaleString("en-US");$("status").textContent=d.message||"تعذر تسجيل الرهان";renderBets();return}const r=d.result||{};if(r.gameId!=="pizza-yam"||!Number.isSafeInteger(Number(r.coins)))return;coins=Number(r.coins);$("coins").textContent=coins.toLocaleString("en-US");$("status").textContent="تم تأكيد الرهان — انتظر نتيجة الجولة";betRequestId="";requestState();return}
if(d.requestId===stateRequestId){statePending=false;stateRequestId="";if(!d.ok){$("status").textContent=d.message||"تعذر تحديث اللعبة";return}const r=d.result||{};if(r.gameId!=="pizza-yam")return;if(Number.isSafeInteger(Number(r.coins))){coins=Number(r.coins);$("coins").textContent=coins.toLocaleString("en-US")}if(Number(r.roundNumber))lastRound=Number(r.roundNumber);if(r.remainingMs!=null)$("countdown").textContent=Math.max(0,Math.ceil(Number(r.remainingMs)/1000));if(r.phase==="bet"&&!busy){$("status").textContent="اختار مقدار الرهان والطعام"}if(r.phase==="result"&&r.outcome&&r.userSettlement&&r.userSettlement.settled){if(busy||r.userSettlement.hasBets)finishRound(r)}}
});
renderBets();requestState();setInterval(()=>{if(!statePending)requestState()},700);
})();
</script>
</body></html>
