<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بيتزا يم</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#7025a9,#22074f 78%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:480px;height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;color:#ffe17a;margin:0}.wallet{background:#ffd21f;color:#422600;border-radius:18px;padding:9px 16px;font-weight:bold;text-align:center}.hint{text-align:center;color:#e4d3ff;font-size:13px}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:9px;align-content:center}.food{border:2px solid #d7a6ff;border-radius:18px;background:linear-gradient(145deg,#6622a0,#351064);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;box-shadow:0 5px 12px #10002099;color:white;font-size:34px;position:relative;min-width:0}.food small{font-size:12px;color:#ffe17a;font-weight:bold}.food .stake{font-size:11px;color:#fff;background:#271044b8;border-radius:8px;padding:3px 6px;min-height:18px}.food.selected{border-color:#ffe17a;box-shadow:0 0 0 3px #ffe17a55,0 5px 12px #10002099}.food.win{background:linear-gradient(145deg,#1b9b68,#075b4a);border-color:#9dffd2}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip,.spin,.clear{border:0;border-radius:14px;padding:10px 13px;font-weight:bold;background:#422078;color:#fff}.chip.active{background:#ffd21f;color:#432900}.actions{display:flex;gap:8px}.spin{flex:1;background:linear-gradient(90deg,#ffbd22,#ffe77c);color:#402000;font-size:17px}.clear{background:#5b2b82}.spin:disabled{opacity:.5}@keyframes pizzaSpin{to{transform:rotate(360deg)}}.board.spinning .food{animation:pizzaSpin .7s linear infinite}.status{text-align:center;min-height:26px;font-weight:bold;color:#ffe17a}.total{text-align:center;color:#fff;font-weight:bold}.footer{text-align:center;color:#cdb7eb;font-size:12px}
</style></head><body><main class="app"><div class="top"><span>🍕</span><h1>بيتزا يم</h1><div class="wallet">🪙 <span id="coins">—</span></div></div><div class="hint">اختر قيمة الرهان ثم اضغط على أكثر من طبق لتوزيع رهاناتك</div><section class="board" id="board"></section><div class="chips" id="chips"></div><div class="total">إجمالي الرهان: <span id="total">0</span></div><div class="actions"><button class="clear" id="clear">مسح الرهانات</button><button class="spin" id="spin" disabled>تأكيد الرهانات</button></div><div class="status" id="status">جارٍ الاتصال بالمحفظة…</div><div class="footer">النتائج والرصيد معتمدان من خادم ميجو لايف</div></main>
<script>
(()=>{"use strict";
const foods=[["🥕",5],["🥑",5],["🥬",5],["🍅",5],["🌯",10],["🌭",15],["🍕",25],["🍗",45]];
const chips=[10,50,100,1000,10000];let bets=Array(8).fill(0),bet=10,busy=false,coins=0,pending="",statePending=false;
const $=id=>document.getElementById(id),board=$("board");
function renderBets(){let total=bets.reduce((a,b)=>a+b,0);[...board.children].forEach((el,i)=>el.querySelector(".stake").textContent=bets[i]?("🪙 "+bets[i].toLocaleString("en-US")):"بدون رهان");$("total").textContent=total.toLocaleString("en-US");$("spin").disabled=busy||total===0}
foods.forEach((f,i)=>{const b=document.createElement("button");b.className="food";b.innerHTML=f[0]+"<small>"+f[1]+"×</small><span class=\"stake\">بدون رهان</span>";b.onclick=()=>{if(busy)return;bets[i]+=bet;renderBets()};board.append(b)});
const chipsEl=$("chips");chips.forEach(v=>{const b=document.createElement("button");b.className="chip"+(v===bet?" active":"");b.textContent=v.toLocaleString("en-US");b.onclick=()=>{if(busy)return;bet=v;[...chipsEl.children].forEach(x=>x.classList.toggle("active",x===b))};chipsEl.append(b)});
function key(){const a=new Uint8Array(24);crypto.getRandomValues(a);return "pizza-yam-"+[...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function send(action,payload,id){parent.postMessage({t:"migo:game:request",gameId:"pizza-yam",action,requestId:id,payload:payload||{}},"*")}
function syncState(){if(statePending||busy)return;statePending=true;pending=key();send("state",{},pending)}
$("clear").onclick=()=>{if(busy)return;bets=Array(8).fill(0);renderBets();$("status").textContent="تم مسح الرهانات"};
$("spin").onclick=()=>{if(busy||bets.every(v=>v===0))return;busy=true;$("spin").disabled=true;$("clear").disabled=true;$("status").textContent="جاري تسجيل رهاناتك على الخادم…";pending=key();send("spin",{bets:bets.slice()},pending)};
window.addEventListener("message",e=>{const d=e.data;if(!d||d.t!=="migo:game:response"||d.requestId!==pending)return;
if(!d.ok){busy=false;$("clear").disabled=false;if(Number.isSafeInteger(Number(d.coins))){coins=Number(d.coins);$("coins").textContent=coins.toLocaleString("en-US")} $("status").textContent=d.message||"تعذر تنفيذ الجولة";renderBets();return}
const r=d.result||{};if(r.gameId!=="pizza-yam"||!Number.isSafeInteger(Number(r.coins)))return;
coins=Number(r.coins);$("coins").textContent=coins.toLocaleString("en-US");busy=false;$("clear").disabled=false;
if(r.outcome){const o=r.outcome;[...board.children].forEach((x,i)=>x.classList.toggle("win",(o.winningIndices||[]).includes(i)));$("status").textContent=Number(r.payout)>0?"مبروك! ربحت "+Number(r.payout).toLocaleString("en-US")+" عملة":"لم تفز هذه المرة";bets=Array(8).fill(0)}
else $("status").textContent="تم تحديث المحفظة";
renderBets();
});
renderBets();syncState();setInterval(syncState,500);})();
</script></body></html>
