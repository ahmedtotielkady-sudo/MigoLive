<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بيتزا يم</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#7025a9,#22074f 78%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:480px;height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;color:#ffe17a;margin:0}.wallet{background:#ffd21f;color:#422600;border-radius:18px;padding:9px 16px;font-weight:bold;text-align:center}.hint{text-align:center;color:#e4d3ff;font-size:13px}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:9px;align-content:center}.food{border:2px solid #d7a6ff;border-radius:18px;background:linear-gradient(145deg,#6622a0,#351064);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;box-shadow:0 5px 12px #10002099;color:white;font-size:34px;position:relative}.food small{font-size:12px;color:#ffe17a;font-weight:bold}.food.selected{border-color:#ffe17a;box-shadow:0 0 0 3px #ffe17a55,0 5px 12px #10002099}.food.win{background:linear-gradient(145deg,#1b9b68,#075b4a);border-color:#9dffd2}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip,.spin{border:0;border-radius:14px;padding:10px 15px;font-weight:bold;background:#422078;color:#fff}.chip.active{background:#ffd21f;color:#432900}.spin{background:linear-gradient(90deg,#ffbd22,#ffe77c);color:#402000;font-size:17px}.spin:disabled{opacity:.5}.status{text-align:center;min-height:26px;font-weight:bold;color:#ffe17a}.footer{text-align:center;color:#cdb7eb;font-size:12px}
</style></head><body><main class="app"><div class="top"><span>🍕</span><h1>بيتزا يم</h1><div class="wallet">🪙 <span id="coins">—</span></div></div><div class="hint">اختر مقدار الرهان ثم الطعام واضغط العب</div><section class="board" id="board"></section><div class="chips" id="chips"></div><button class="spin" id="spin" disabled>ابدأ الجولة</button><div class="status" id="status">جارٍ الاتصال بالمحفظة…</div><div class="footer">النتائج والرصيد معتمدان من خادم ميجو لايف</div></main>
<script>
(()=>{"use strict";
const foods=[["🥕",5],["🥑",5],["🥬",5],["🍅",5],["🌯",10],["🌭",15],["🍕",25],["🍗",45]];
const chips=[10,50,100,1000,10000];let selected=0,bet=10,busy=false,coins=0,pending="";
const $=id=>document.getElementById(id);
const board=$("board");
foods.forEach((f,i)=>{const b=document.createElement("button");b.className="food"+(i===0?" selected":"");b.innerHTML=f[0]+"<small>"+f[1]+"×</small>";b.onclick=()=>{if(busy)return;selected=i;[...board.children].forEach((x,n)=>x.classList.toggle("selected",n===i))};board.append(b)});
const chipsEl=$("chips");chips.forEach(v=>{const b=document.createElement("button");b.className="chip"+(v===bet?" active":"");b.textContent=v.toLocaleString("en-US");b.onclick=()=>{if(busy)return;bet=v;[...chipsEl.children].forEach(x=>x.classList.toggle("active",x===b))};chipsEl.append(b)});
function key(){const a=new Uint8Array(20);crypto.getRandomValues(a);return "pizza-yam-"+[...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function send(action,payload,id){parent.postMessage({t:"migo:game:request",gameId:"pizza-yam",action,requestId:id,payload:payload||{}},"*")}
function syncWallet(){const id=key();pending=id;send("wallet",{},id)}
$("spin").onclick=()=>{if(busy)return;busy=true;$("spin").disabled=true;$("status").textContent="جاري تنفيذ الجولة على الخادم…";pending=key();send("spin",{foodIndex:selected,bet},pending)};
window.addEventListener("message",e=>{const d=e.data;if(!d||d.t!=="migo:game:response"||d.requestId!==pending)return;
if(!d.ok){busy=false;$("spin").disabled=false;if(Number.isSafeInteger(Number(d.coins))){coins=Number(d.coins);$("coins").textContent=coins.toLocaleString("en-US")} $("status").textContent=d.message||"تعذر تنفيذ الجولة";return}
const r=d.result||{};if(r.gameId!=="pizza-yam"||!Number.isSafeInteger(Number(r.coins)))return;
coins=Number(r.coins);$("coins").textContent=coins.toLocaleString("en-US");busy=false;$("spin").disabled=false;
if(r.outcome){const o=r.outcome;[...board.children].forEach((x,i)=>x.classList.toggle("win",(o.winningIndices||[]).includes(i)));$("status").textContent=Number(r.payout)>0?"مبروك! ربحت "+Number(r.payout).toLocaleString("en-US")+" عملة":"لم تفز هذه المرة"}
else $("status").textContent="تم تحديث المحفظة";
});
syncWallet();})();
</script></body></html>
