<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سلوت 777</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1466;--bg2:#5a2bb8;--cell:#3b0f4a;--gold:#ffd24a;--gold2:#c98a12;--txt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0b44;--bg2:#3b1a85;--cell:#2a0a36}}
:root[data-theme="dark"]{--bg1:#1a0b44;--bg2:#3b1a85;--cell:#2a0a36}
html,body{height:100%;margin:0}
body{background-color:var(--bg1);font-family:Cairo,Tahoma,sans-serif;color:var(--txt);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;z-index:1;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px;gap:8px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:8px;padding-inline-start:96px;margin-top:12px;transform:translateY(8px)}
.av{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--gold);background:#0008 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.coins{background:#0008;border:2px solid var(--gold);border-radius:20px;padding:2px 10px;font-weight:900;display:flex;gap:6px;align-items:center;direction:ltr}
.coins button{background:var(--gold);border:0;border-radius:50%;width:22px;height:22px;font-weight:900;color:#5a2b00}
.sp{flex:1}
.ib{background:#0008;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;color:#fff}
h1{margin:0;text-align:left;transform:translateY(8px);padding-left:8px;font-size:clamp(36px,12vw,54px);font-weight:900;letter-spacing:2px;background:linear-gradient(#fff6b0,#ffc61a 55%,#e08a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3a00);line-height:1}
.machine{position:relative;margin-top:clamp(38px,4.5vh,52px);background:linear-gradient(#ffe27a,var(--gold2));border-radius:18px;padding:12px;box-shadow:0 6px 0 #8a5a00,0 0 30px #ffc84a66;animation:glow 2s linear infinite}
.machine::before{content:"";position:absolute;inset:2px;border:6px dotted #ff3a5e;border-radius:16px;pointer-events:none;animation:bulbs 2s linear infinite}
.machine::after{content:"";position:absolute;inset:2px;border:6px dotted #fff;border-radius:16px;pointer-events:none;opacity:.55;clip-path:inset(0);animation:twinkle .6s steps(1) infinite alternate;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 12px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 12px)}
@keyframes bulbs{0%,100%{border-color:#ff3a5e;filter:drop-shadow(0 0 6px #ff3a5e)}25%{border-color:#ffe24a;filter:drop-shadow(0 0 6px #ffe24a)}50%{border-color:#3af0ff;filter:drop-shadow(0 0 6px #3af0ff)}75%{border-color:#ff3aff;filter:drop-shadow(0 0 6px #ff3aff)}}
@keyframes twinkle{from{opacity:.15}to{opacity:.7}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 #8a5a00,0 0 30px #ff3a5e88}25%{box-shadow:0 6px 0 #8a5a00,0 0 30px #ffe24a88}50%{box-shadow:0 6px 0 #8a5a00,0 0 30px #3af0ff88}75%{box-shadow:0 6px 0 #8a5a00,0 0 30px #ff3aff88}}
.reels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;background:var(--cell);padding:5px;border-radius:10px;direction:ltr}
.reel{display:grid;gap:5px;min-width:0;container-type:inline-size;clip-path:inset(0 -10px)}
.cell{aspect-ratio:1;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,9vw,46px);font-size:56cqw;line-height:1;border:2px solid #ffd24a66;border-radius:10px;background:radial-gradient(circle at 50% 40%,#6a2a8a,#3a0f4e);overflow:hidden;transition:transform .15s}
.cell.hit{animation:pop .5s ease infinite alternate;background:radial-gradient(circle at 50% 40%,#ffd24a88,#7a3a8a);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
@keyframes pop{to{transform:scale(1.12)}}
.cell b{font-size:clamp(11px,3.4vw,16px);font-size:17cqw;font-weight:900;border-radius:8px;padding:6px 3px;padding:8cqw 4cqw;border:2px solid #fff8;line-height:1;letter-spacing:0}
.cell b.w{background:linear-gradient(#ff7a7a,#c4001a)}
.cell b.b{background:linear-gradient(#5cf0b0,#0a8a5a)}
.win{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:8px;font-weight:900}
.win div{background:linear-gradient(#ff7a4a,#c42a00);border-radius:8px;padding:2px 18px;min-width:90px;text-align:center;font-size:22px;border:2px solid #ffd2a0}
.info{text-align:center;min-height:24px;font-weight:700;color:var(--gold)}
.panel{margin-top:auto;transform:translateY(-12px);direction:ltr;display:grid;grid-template-columns:minmax(0,1.5fr) auto minmax(0,.8fr);align-items:center;gap:10px;background:linear-gradient(#2a1470e6,#160a45f2);border:2px solid #ffd24a88;border-radius:22px;padding:8px 10px;box-shadow:0 4px 14px #0008,inset 0 1px 0 #fff3}
.bet{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;background:#0006;border:1px solid #ffd24a55;border-radius:14px;padding:5px;direction:ltr}
.bet button{background:linear-gradient(#ffe27a,#d99a12);border:0;border-radius:50%;width:36px;height:36px;padding:0;color:#5a2b00;font-size:20px;font-weight:900;line-height:1;box-shadow:0 2px 0 #8a5a00}.bet button:active{transform:translateY(1px);box-shadow:none}
.bet div{text-align:center;font-weight:900;font-size:18px;line-height:1;color:#fff}
.bet small{display:block;font-size:10px;color:var(--gold);margin-top:3px}
#spin{width:68px;height:68px;padding:0;border-radius:50%;border:3px solid #fff7;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffb81a 55%,#e07a00);font-family:inherit;font-size:16px;font-weight:900;color:#6a2c00;box-shadow:0 4px 0 #8a4a00,0 0 16px #ffc84a99}#spin:active{transform:translateY(2px);box-shadow:0 2px 0 #8a4a00}
#spin.stop{background:radial-gradient(circle at 35% 30%,#ffb09a,#ff4a2a 60%,#b81a00);color:#fff;box-shadow:0 4px 0 #6a1000,0 0 16px #ff5a3a99}
.auto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;direction:rtl;background:#0006;border:1px solid #ffd24a55;border-radius:14px;padding:6px 4px;font-weight:700;font-size:11px;line-height:1.25;text-align:center;color:#fff}
.auto input{appearance:none;-webkit-appearance:none;width:38px;height:22px;margin:0;border-radius:12px;background:#666;position:relative;transition:background .2s;cursor:pointer}.auto input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}.auto input:checked{background:#2ecc71}.auto input:checked::after{transform:translateX(16px)}
.note{text-align:center;font-size:11px;opacity:.7;padding-bottom:4px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.modal[hidden]{display:none}
.box{background:#bfeaf2;color:#234;border-radius:14px;padding:18px;width:min(86vw,360px);text-align:center;font-weight:700}
.box p{margin:0 0 14px;white-space:pre-line;line-height:1.7}
.box div{display:flex;gap:8px}
.box button{flex:1;border:0;border-radius:10px;padding:12px;font-family:inherit;font-weight:900;font-size:16px;background:linear-gradient(#ffe24a,#ff9a1a);color:#5a2b00}
.box button.g{background:#9aa;color:#fff}
@media (prefers-reduced-motion:reduce){.cell.hit,.machine,.machine::before,.machine::after{animation:none}}

 if(pendingSpinIndex!==index)throw new Error('هناك جولة سابقة لم يصل تأكيدها؛ أعد نفس مستوى الرهان أولاً');
 const response=await fetch(apiBase()+'/games/slot777/spin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Idempotency-Key':pendingSpinKey},body:JSON.stringify({multiplierIndex:index})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok){
   if(response.status===400||response.status===409){pendingSpinKey='';pendingSpinIndex=null;persistPendingSpin()}
   if(response.status===401)parent.postMessage({t:'get'},'*');
   throw new Error(data.error||('HTTP '+response.status));
 }
 pendingSpinKey='';pendingSpinIndex=null;persistPendingSpin();
 return data;
}
addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(!d)return;if(d.t==='bal'&&Number.isFinite(d.v)){bal=Math.max(0,Math.floor(d.v));const incoming=String(d.token||'');if(incoming&&incoming!==token){token=incoming;restorePendingSpin();loadServerState()}ready=!!token;upd()}else if(d.t==='me'){me=d;ap()}});
try{parent.postMessage({t:'get'},'*')}catch(e){}
// لا تنشئ رصيدًا افتراضيًا عند فشل الاتصال بالخادم؛ الرصيد يأتي من المحفظة فقط.

// RNG: single function, easy to tune via WT
function rnd(nw){const w=WT.map((x,i)=>nw&&i===W?0:x);let r=Math.random()*w.reduce((a,b)=>a+b),i=0;while((r-=w[i])>=0)i++;return i}
const makeGrid=nw=>Array.from({length:5},()=>[rnd(nw),rnd(nw),rnd(nw)]);
function evaluate(g,bet){
  const line=bet/40;let win=0,hit=new Set(),bonus=0;
  g.forEach(c=>c.forEach(s=>{if(s===B)bonus++}));
  LINES.forEach(L=>{
    const s=L.map((r,i)=>g[i][r]);
    let b=s.find(x=>x!==W);if(b===undefined)b=2;if(b===B)return;
    let n=0;while(n<5&&(s[n]===b||s[n]===W))n++;
    const p=PAY[b][n];
    if(p){win+=line*p;for(let i=0;i<n;i++)hit.add(i+','+L[i])}
  });
  if(bonus>=3)g.forEach((c,i)=>c.forEach((s,r)=>{if(s===B)hit.add(i+','+r)}));
  return{win,hit,bonus};
}

// UI
const cells=[];
const reelsEl=$('reels');
for(let i=0;i<5;i++){
  const col=document.createElement('div');col.className='reel';cells.push([]);
  for(let r=0;r<3;r++){const c=document.createElement('div');c.className='cell';col.appendChild(c);cells[i].push(c)}
  reelsEl.appendChild(col);
}
function setCell(c,s){
  c._s=s;c.className='cell';
  if(s===W)c.innerHTML='<b class="w">WILD</b>';
  else if(s===B)c.innerHTML='<b class="b">BONUS</b>';
  else if(s===2)c.innerHTML=GOLD;
  else c.textContent=E[s];
}
const fmt=n=>Math.round(n).toLocaleString('en-US');
function upd(){
  $('bal').textContent=fmt(bal);
  const bet=BASE*MULT[mi];
  $('bv').textContent=fmt(bet);$('bm').textContent=BASE+' X '+MULT[mi];
  $('msg').textContent=free>0?'لفات مجانية: '+free:'';
  save();
}
function updAuto(){$('autoL').textContent=auto>0?'تلقائي: باقي '+auto:'تلقائي 10 مرات';$('auto').checked=auto>0}
function modal(text,btns){
  $('mt').textContent=text;const mb=$('mb');mb.innerHTML='';
  btns.forEach(([t,fn,cls])=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=()=>{$('modal').hidden=true;fn&&fn()};mb.appendChild(b)});
  $('modal').hidden=false;
}
function beep(f){
  if(!sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.05;
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.08)}catch(e){}
}
function clearHit(){cells.flat().forEach(c=>c.classList.remove('hit'))}
function countUp(to){
  const t0=performance.now(),d=Math.min(1200,300+to/40);
  (function f(t){const p=Math.min(1,(t-t0)/d);$('win').textContent=fmt(to*p);if(p<1)requestAnimationFrame(f)})(t0);
}

async function spin(){
  if(spinning){stopNow=true;return}
  if(!token){auto=0;updAuto();modal('سجّل الدخول أولاً لربط اللعبة بالمحفظة',[['حسنًا',null,'g']]);return}
  spinning=true;stopNow=false;
  $('spin').textContent='جاري الاتصال';$('spin').disabled=true;
  let server;
  try{server=await requestServerSpin(mi)}
  catch(error){spinning=false;$('spin').disabled=false;$('spin').textContent='دوران';$('spin').classList.remove('stop');auto=0;updAuto();$('msg').textContent=error.message;return}
  const bet=BASE*MULT[mi],isFree=!!server.freeSpin,grid=server.grid;
  const win=Number(server.win)||0,bonus=Number(server.bonus)||0,hit=Array.isArray(server.hit)?server.hit:[];
  if(!Array.isArray(grid)||grid.length!==5||grid.some(c=>!Array.isArray(c)||c.length!==3)){
    spinning=false;$('spin').disabled=false;$('spin').textContent='دوران';$('msg').textContent='استجابة الجولة غير صالحة؛ تواصل مع الدعم';return
  }
  $('win').textContent='0';clearHit();
  $('spin').textContent='قف';$('spin').classList.add('stop');$('spin').disabled=false;
  const g=grid;
  await Promise.all(cells.map((col,i)=>new Promise(res=>{
    const t=setInterval(()=>{const p=col.map(c=>c._s);setCell(col[2],p[1]);setCell(col[1],p[0]);setCell(col[0],rnd())},90);
    const stopAt=Date.now()+500+i*260;
    const chk=setInterval(()=>{
      if(Date.now()>=stopAt||stopNow){
        clearInterval(t);clearInterval(chk);
        col.forEach((c,r)=>{setCell(c,g[i][r]);c.animate([{transform:'translateY(-140%)'},{transform:'translateY(5%)',offset:.7},{transform:'none'}],{duration:280,easing:'ease-out',delay:(2-r)*60,fill:'backwards'})});beep(300+i*40);setTimeout(res,400);
      }
    },30);
  })));
  hit.forEach(k=>{const[i,r]=k.split(',');if(cells[Number(i)]&&cells[Number(i)][Number(r)])cells[Number(i)][Number(r)].classList.add('hit')});
  bal=Math.max(0,Math.floor(Number(server.balance)||0));free=Math.max(0,Math.min(1000,Number(server.freeSpins)||0));pend=0;
  if(win>0){countUp(win);beep(660);setTimeout(()=>beep(880),120)}
  spinning=false;stopNow=false;
  $('spin').textContent='دوران';$('spin').classList.remove('stop');
  upd();if(bonus>=3)$('msg').textContent='بونص! لفات مجانية: '+free;
  else $('msg').textContent=win>0?'ربحت '+fmt(win)+' عملة':'حظ أوفر — لم تحقق ربحًا';
  parent.postMessage({t:'get'},'*');
  if(free>0)setTimeout(()=>{if(!spinning)spin()},1400);
  else if(auto>0){auto--;updAuto();setTimeout(()=>{if(!spinning)spin()},1000)}
}

$('spin').onclick=spin;
$('up').onclick=()=>{if(!spinning){mi=Math.min(MULT.length-1,mi+1);upd()}};
$('minus').onclick=()=>{if(!spinning){mi=Math.max(0,mi-1);upd()}};
$('auto').onchange=e=>{auto=e.target.checked?10:0;updAuto();if(auto>0&&!spinning){auto--;updAuto();spin()}};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';beep(500)};
$('plus').onclick=toWallet;
$('inf').onclick=()=>modal('5 بكرات × 3 صفوف، 40 خط دفع.\nالرمز يربح من اليسار: 3 أو أكثر (و2 للألماس واللؤلؤ والذهب والأناناس).\nWILD بديل لكل الرموز عدا BONUS ولا يظهر في اللفات المجانية.\n3/4/5 BONUS في أي مكان = 3/6/10 لفات مجانية.',[['حسنًا',null]]);
document.addEventListener('visibilitychange',()=>{if(document.hidden){auto=0;updAuto()}});

// initial board
const init=makeGrid();init.forEach((c,i)=>c.forEach((s,r)=>setCell(cells[i][r],s)));
upd();updAuto();if(token)loadServerState();
</script>
