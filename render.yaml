services:
  - type: web
    name: migolive-api
    runtime: node
    plan: free
    region: frankfurt
    branch: codex/wallet-security-audit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_BOOTSTRAP_CODE
        generateValue: true
      - key: PAYMENT_WALLET_NUMBER
        sync: false
