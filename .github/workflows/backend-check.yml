name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/wallet-security-audit]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          find backend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
