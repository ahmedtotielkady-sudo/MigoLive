name: Build MigoLive local Android APK

on:
  push:
    branches:
      - main
      - android-preview
      - feature/agency-owner-approval
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply MigoLive room interaction fixes
        run: python3 scripts/apply-room-repairs.py

      - name: Apply in-room game launcher and display cleanup
        run: python3 scripts/apply-game-room-launcher.py

      - name: Apply local notification center
        run: python3 scripts/apply-notification-center.py

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp migolive-back-navigation.js www/migolive-back-navigation.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text(encoding='utf-8')
          tags = [
              '<script src="migolive-back-navigation.js"></script>'
          ]
          for tag in tags:
              if tag not in html:
                  if '</body>' not in html:
                      raise SystemExit('index.html has no closing body tag; refusing unsafe injection')
                  html = html.replace('</body>', tag + '\\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.kind = ''
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      attrs = dict(attrs)
                      self.active = 'src' not in attrs
                      self.kind = attrs.get('type', '').lower()
                      self.current = []
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.active:
                      if self.kind in ('', 'text/javascript', 'application/javascript', 'module'):
                          self.parts.append(''.join(self.current))
                      self.active = False
          parser = Scripts()
          parser.feed(Path('www/index.html').read_text(encoding='utf-8'))
          scripts = [x for x in parser.parts if x.strip()]
          if not scripts:
              raise SystemExit('No inline JavaScript found to validate')
          for i, source in enumerate(scripts):
              Path(f'/tmp/migolive-inline-{i}.js').write_text(source, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline JavaScript block(s)')
          PY
          for file in /tmp/migolive-inline-*.js; do node --check "$file"; done
          cp slot-777.html slot-ocean-storm.html wheel-animals.html www/
          mkdir -p www/games
          if [ -d games ]; then cp -R games/. www/games/; fi
          test -s www/games/cleopatra-gold.html
          test -s www/games/big-warrior.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/games/big-warrior.html')
          html = p.read_text(encoding='utf-8')
          css = """
          <style id="migo-warrior-compact-v1">
          html,body{overflow:hidden!important}
          #app{padding:8px 12px 10px!important}
          .top{gap:7px!important}.chip{font-size:14px!important;padding:2px 10px!important}
          .prize{margin:7px auto 4px!important;padding:3px 20px!important}.prize b{font-size:23px!important}
          .top{transform:translateY(11px)!important;position:relative;z-index:5}
          .arena{gap:7px!important}.card{height:75%!important;max-height:calc(100dvh - 430px)!important;border-width:2px!important}
          .card .fighter{font-size:74px!important}.card .name{font-size:15px!important;padding:2px 0!important}
          .drawbtn{margin-top:2px!important;padding:1px 16px!important}
          .status{margin:3px auto!important;padding:2px 14px!important;font-size:12px!important}
          .bet{gap:6px!important}.step{width:44px!important;font-size:25px!important}
          .go{font-size:17px!important;padding:4px 0!important}.go small{font-size:14px!important}
          .note{margin-top:2px!important}
          #app{padding-bottom:16px!important}
          @media(max-height:640px){.card .fighter{font-size:54px!important}.card{height:72%!important}.prize{margin:4px auto 2px!important}.status{margin:3px auto!important}}
          </style>
          """
          if 'migo-warrior-compact-v1' not in html:
              html = html.replace('</head>', css + '\\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/games/cleopatra-gold.html')
          html = p.read_text(encoding='utf-8')
          css = """
          <style id="migo-cleopatra-safe-layout-v1">
          html,body{width:100%;height:100%;height:100dvh;overflow:hidden!important}
          body{margin:0!important;padding:0!important}
          .app{box-sizing:border-box!important;height:100dvh!important;min-height:0!important;padding-top:calc(env(safe-area-inset-top,0px) + 23px)!important;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5px)!important;gap:4px!important}
          .hero{margin-top:0!important;flex-shrink:0!important}
          .top{flex-shrink:0!important}
          .stage{min-height:0!important;overflow:hidden!important}
          .stage .reels{max-height:100%!important;max-width:100%!important}
          .ctl{padding-bottom:env(safe-area-inset-bottom,0px)!important}
          </style>
          """
          if 'migo-cleopatra-safe-layout-v1' not in html:
              html = html.replace('</head>', css + '\\n</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.parts=[]; self.current=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.active='src' not in dict(attrs); self.current=[]
              def handle_data(self,data):
                  if self.active:self.current.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.active:self.parts.append(''.join(self.current));self.active=False
          for path in ['www/games/cleopatra-gold.html','www/games/big-warrior.html']:
              parser=Scripts();parser.feed(Path(path).read_text(encoding='utf-8'))
              for i,source in enumerate(parser.parts):
                  if source.strip():
                      Path(f'/tmp/{Path(path).stem}-{i}.js').write_text(source,encoding='utf-8')
          PY
          for file in /tmp/cleopatra-gold-*.js /tmp/big-warrior-*.js; do node --check "$file"; done
          echo "Verified game assets:"
          ls -lh www/games/cleopatra-gold.html www/games/big-warrior.html

      - name: Install Capacitor
        run: npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      # Keep one debug signing key across CI builds so Android accepts updates.
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: migolive-debug-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set increasing Android version code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('Expected android/app/build.gradle after Capacitor sync')
          s = p.read_text()
          code = int(os.environ['GITHUB_RUN_NUMBER'])
          if re.search(r'versionCode\s+\d+', s):
              s = re.sub(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          else:
              raise SystemExit('versionCode not found; refusing to produce a non-upgradeable APK')
          if re.search(r'versionName\s+"[^"]+"', s):
              s = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{code}"', s, count=1)
          p.write_text(s)
          print(f'Android versionCode={code}, versionName=1.0.{code}')
          PY
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Give APK a unique test filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MigoLive_Test_V2_2026.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MigoLive_Test_V2_2026
          path: MigoLive_Test_V2_2026.apk
          if-no-files-found: error
          retention-days: 7
