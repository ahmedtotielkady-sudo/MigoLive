name: Secure owner bootstrap

on:
  workflow_dispatch:
    inputs:
      owner_username:
        description: "Existing MigoLive account username to promote to owner"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate required secret
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Add the MONGODB_URI repository secret before running this workflow."
            exit 1
          fi

      - name: Grant owner role (one owner only)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OWNER_USERNAME: ${{ inputs.owner_username }}
        run: node backend/scripts/bootstrap-owner.js
