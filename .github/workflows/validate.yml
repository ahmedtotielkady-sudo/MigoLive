name: Validate MigoLive
on:
  push:
    branches:
      - codex/wallet-security-audit
  pull_request:
    branches:
      - codex/wallet-security-audit
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript syntax
        run: |
          find backend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js
          node --check worker.mjs
      - name: Build static deployment assets
        run: npm run build:cloudflare
